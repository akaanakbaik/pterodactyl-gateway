name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Jalankan tanpa mempublikasikan
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME tidak cocok dengan package.json versi $PACKAGE_VERSION."
            exit 1
          fi

      - name: Resolve npm dist-tag and release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check existing npm version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@akaanakbaik/pterodactyl-gateway@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package
        run: npm run verify

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --dry-run --access public --tag ${{ steps.meta.outputs.tag }}

      - name: Publish to npm
        if: (github.event_name == 'push' || !inputs.dry-run) && steps.registry.outputs.exists == 'false'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if npm publish --provenance --access public --tag ${{ steps.meta.outputs.tag }}; then
            exit 0
          fi
          echo "Publish dengan NPM_TOKEN gagal; mencoba trusted publishing OIDC."
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public --tag ${{ steps.meta.outputs.tag }}

      - name: Skip already published version
        if: steps.registry.outputs.exists == 'true'
        run: echo "Versi ${{ steps.meta.outputs.version }} sudah ada di npm; publikasi dilewati."

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

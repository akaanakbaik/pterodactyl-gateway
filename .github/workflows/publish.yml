name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Jalankan tanpa mempublikasikan
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  CI: true
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME tidak cocok dengan package.json versi $PACKAGE_VERSION."
            exit 1
          fi

      - name: Resolve npm dist-tag and release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Check existing npm version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@akaanakbaik/pterodactyl-gateway@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package
        run: npm run verify

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs['dry-run']
        run: npm publish --dry-run --force --access public --tag ${{ steps.meta.outputs.tag }}

      - name: Publish to npm
        id: publish
        if: (github.event_name == 'push' || !inputs['dry-run']) && steps.registry.outputs.exists == 'false'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          if npm publish --provenance --access public --tag ${{ steps.meta.outputs.tag }}; then
            exit 0
          fi
          echo "Publish via trusted publishing OIDC gagal; mencoba NPM_TOKEN."
          NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --provenance --access public --tag ${{ steps.meta.outputs.tag }}

      - name: Verify npm publication
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          DIST_TAG="${{ steps.meta.outputs.tag }}"
          for attempt in $(seq 1 24); do
            PUBLISHED_VERSION="$(npm view "@akaanakbaik/pterodactyl-gateway@${VERSION}" version 2>/dev/null || true)"
            PUBLISHED_TAG="$(npm view "@akaanakbaik/pterodactyl-gateway" "dist-tags.${DIST_TAG}" 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$VERSION" ] && [ "$PUBLISHED_TAG" = "$VERSION" ]; then
              echo "npm verified: $VERSION (dist-tag: $DIST_TAG)"
              exit 0
            fi
            echo "Menunggu npm: percobaan $attempt/24 (versi=${PUBLISHED_VERSION:-belum ada}, tag=${PUBLISHED_TAG:-belum ada})"
            sleep 10
          done
          echo "npm belum menampilkan $VERSION dengan dist-tag $DIST_TAG."
          exit 1

      - name: Skip already published version
        if: steps.registry.outputs.exists == 'true'
        run: echo "Versi ${{ steps.meta.outputs.version }} sudah ada di npm; publikasi dilewati."

      - name: Create GitHub release
        if: |
          github.event_name == 'push' &&
          (github.ref_type == 'tag' || (steps.registry.outputs.exists == 'false' && steps.publish.outcome == 'success'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

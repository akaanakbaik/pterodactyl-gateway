name: Release Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-check:
    name: Release package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Pack tarball
        run: npm pack

      - name: Install packed package in temp project
        run: |
          set -euo pipefail
          PACKAGE_TGZ="$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          npm install --prefix "$SMOKE_DIR" "$PWD/$PACKAGE_TGZ" --force
          CLI="$SMOKE_DIR/node_modules/@akaanakbaik/pterodactyl-gateway/dist/cli-entry.js"
          WIZARD="$SMOKE_DIR/node_modules/@akaanakbaik/pterodactyl-gateway/dist/wizard-cli.js"
          test -f "$CLI"
          test -f "$WIZARD"
          node "$CLI" version
          node "$CLI" self-check
          node "$CLI" release-check
          node "$CLI" templates list
          node "$WIZARD" help

      - name: Sensitive command help check
        run: |
          set -euo pipefail
          PACKAGE_TGZ="$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          npm install --prefix "$SMOKE_DIR" "$PWD/$PACKAGE_TGZ" --force
          CLI="$SMOKE_DIR/node_modules/@akaanakbaik/pterodactyl-gateway/dist/cli-entry.js"
          node "$CLI" help > help.txt
          ! grep -E "admin node|admin nodes|allocation-summary|create-allocation" help.txt

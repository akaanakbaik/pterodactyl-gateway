name: Release Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  release-check:
    name: Release package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Run quality gate
        run: npm run verify

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Pack package
        run: npm pack

      - name: Validate packed package in isolated project
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$PWD"
          PACKAGE_TGZ="$WORKSPACE/$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" --ignore-scripts
          NPM_ROOT="$(npm root)"
          PACKAGE_DIR="$NPM_ROOT/@akaanakbaik/pterodactyl-gateway"
          test -f "$PACKAGE_DIR/dist/index.js"
          test -f "$PACKAGE_DIR/dist/index.cjs"
          test -f "$PACKAGE_DIR/dist/index.d.ts"
          test -f "$PACKAGE_DIR/dist/index.d.cts"
          node "$PACKAGE_DIR/dist/cli-entry.js" version --json
          node "$PACKAGE_DIR/dist/cli-entry.js" self-check --json
          node "$PACKAGE_DIR/dist/cli-entry.js" release-check --json
          node "$PACKAGE_DIR/dist/cli-entry.js" templates list
          node "$PACKAGE_DIR/dist/wizard-cli.js" help
          node -e "const m = require('@akaanakbaik/pterodactyl-gateway'); if (typeof m.createPtero !== 'function') process.exit(1);"
          node --input-type=module -e "import { createPtero } from '@akaanakbaik/pterodactyl-gateway'; if (typeof createPtero !== 'function') process.exit(1);"

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-package
          path: akaanakbaik-pterodactyl-gateway-*.tgz
          if-no-files-found: error
          retention-days: 14

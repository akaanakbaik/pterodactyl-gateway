name: Release Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  release-check:
    name: Release package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run verify

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Pack package
        run: npm pack

      - name: Validate packed package in isolated project
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$PWD"
          PACKAGE_TGZ="$WORKSPACE/$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" --ignore-scripts
          NPM_ROOT="$(npm root)"
          PACKAGE_DIR="$NPM_ROOT/@akaanakbaik/pterodactyl-gateway"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$PACKAGE_DIR/dist/cli-entry.js"
          test -f "$PACKAGE_DIR/dist/wizard-cli.js"
          node "$PACKAGE_DIR/dist/cli-entry.js" version --json
          node "$PACKAGE_DIR/dist/cli-entry.js" self-check --json
          node "$PACKAGE_DIR/dist/cli-entry.js" release-check --json
          node "$PACKAGE_DIR/dist/cli-entry.js" templates list
          node "$PACKAGE_DIR/dist/wizard-cli.js" help

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-package
          path: akaanakbaik-pterodactyl-gateway-*.tgz
          if-no-files-found: error
          retention-days: 14

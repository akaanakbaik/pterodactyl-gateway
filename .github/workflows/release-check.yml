name: Release Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-check:
    name: Release package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Pack tarball
        run: npm pack

      - name: Install packed package in temp project
        run: |
          set -euo pipefail
          PACKAGE_TGZ="$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          npm init -y --prefix "$SMOKE_DIR"
          npm install --prefix "$SMOKE_DIR" "$PWD/$PACKAGE_TGZ" --force
          NPM_ROOT="$(npm root --prefix "$SMOKE_DIR")"
          PACKAGE_DIR="$NPM_ROOT/@akaanakbaik/pterodactyl-gateway"
          CLI_BIN="$NPM_ROOT/.bin/ptero-gateway"
          WIZARD_BIN="$NPM_ROOT/.bin/ptero-wizard"
          echo "SMOKE_DIR=$SMOKE_DIR"
          echo "NPM_ROOT=$NPM_ROOT"
          echo "PACKAGE_DIR=$PACKAGE_DIR"
          test -d "$PACKAGE_DIR"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$PACKAGE_DIR/dist/cli-entry.js"
          test -f "$PACKAGE_DIR/dist/wizard-cli.js"
          test -x "$CLI_BIN"
          test -x "$WIZARD_BIN"
          "$CLI_BIN" version
          "$CLI_BIN" self-check
          "$CLI_BIN" release-check
          "$CLI_BIN" templates list
          "$WIZARD_BIN" help

      - name: Sensitive command help check
        run: |
          set -euo pipefail
          PACKAGE_TGZ="$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          npm init -y --prefix "$SMOKE_DIR"
          npm install --prefix "$SMOKE_DIR" "$PWD/$PACKAGE_TGZ" --force
          NPM_ROOT="$(npm root --prefix "$SMOKE_DIR")"
          CLI_BIN="$NPM_ROOT/.bin/ptero-gateway"
          test -x "$CLI_BIN"
          "$CLI_BIN" help > help.txt
          ! grep -E "admin node|admin nodes|allocation-summary|create-allocation" help.txt

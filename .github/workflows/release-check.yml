name: Release Check

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-check:
    name: Release package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Pack tarball
        run: npm pack

      - name: Install packed package in temp project
        run: |
          set -euo pipefail
          WORKSPACE="$PWD"
          PACKAGE_TGZ="$WORKSPACE/$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" --force
          NPM_ROOT="$(npm root)"
          PACKAGE_DIR="$NPM_ROOT/@akaanakbaik/pterodactyl-gateway"
          CLI_BIN="$NPM_ROOT/.bin/ptero-gateway"
          WIZARD_BIN="$NPM_ROOT/.bin/ptero-wizard"
          echo "SMOKE_DIR=$SMOKE_DIR"
          echo "NPM_ROOT=$NPM_ROOT"
          echo "PACKAGE_DIR=$PACKAGE_DIR"
          ls -la "$NPM_ROOT/.bin"
          test -d "$PACKAGE_DIR"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$PACKAGE_DIR/dist/cli-entry.js"
          test -f "$PACKAGE_DIR/dist/wizard-cli.js"
          test -e "$CLI_BIN"
          test -e "$WIZARD_BIN"
          node "$PACKAGE_DIR/dist/cli-entry.js" version
          node "$PACKAGE_DIR/dist/cli-entry.js" self-check
          node "$PACKAGE_DIR/dist/cli-entry.js" release-check
          node "$PACKAGE_DIR/dist/cli-entry.js" templates list
          node "$PACKAGE_DIR/dist/wizard-cli.js" help

      - name: Sensitive command help check
        run: |
          set -euo pipefail
          WORKSPACE="$PWD"
          PACKAGE_TGZ="$WORKSPACE/$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" --force
          NPM_ROOT="$(npm root)"
          PACKAGE_DIR="$NPM_ROOT/@akaanakbaik/pterodactyl-gateway"
          test -f "$PACKAGE_DIR/dist/cli-entry.js"
          node "$PACKAGE_DIR/dist/cli-entry.js" help > "$SMOKE_DIR/help.txt"
          ! grep -E "admin node|admin nodes|allocation-summary|create-allocation" "$SMOKE_DIR/help.txt"

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify
        run: npm run verify

      - name: Security audit
        run: npm audit --audit-level=high

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package artifacts
        run: npm run build

      - name: Pack package
        run: npm pack

      - name: Install packed package in temp project
        run: |
          set -euo pipefail
          WORKSPACE="$PWD"
          PACKAGE_TGZ="$WORKSPACE/$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" --force
          NPM_ROOT="$(npm root)"
          PACKAGE_DIR="$NPM_ROOT/@akaanakbaik/pterodactyl-gateway"
          CLI_BIN="$NPM_ROOT/.bin/ptero-gateway"
          WIZARD_BIN="$NPM_ROOT/.bin/ptero-wizard"
          echo "SMOKE_DIR=$SMOKE_DIR"
          echo "NPM_ROOT=$NPM_ROOT"
          echo "PACKAGE_DIR=$PACKAGE_DIR"
          if [ -d "$NPM_ROOT/.bin" ]; then
            ls -la "$NPM_ROOT/.bin"
          else
            echo "Info: $NPM_ROOT/.bin was not created by npm; validating CLI through package entry files instead."
          fi
          test -d "$PACKAGE_DIR"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$PACKAGE_DIR/dist/cli-entry.js"
          test -f "$PACKAGE_DIR/dist/wizard-cli.js"
          node "$PACKAGE_DIR/dist/cli-entry.js" help
          if [ -e "$CLI_BIN" ]; then test -e "$CLI_BIN"; fi
          if [ -e "$WIZARD_BIN" ]; then test -e "$WIZARD_BIN"; fi

name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run verify

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and pack package
        run: npm run build && npm pack

      - name: Install packed package and test both module systems
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$PWD"
          PACKAGE_TGZ="$WORKSPACE/$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" --ignore-scripts
          NPM_ROOT="$(npm root)"
          PACKAGE_DIR="$NPM_ROOT/@akaanakbaik/pterodactyl-gateway"
          test -f "$PACKAGE_DIR/dist/cli-entry.js"
          test -f "$PACKAGE_DIR/dist/index.cjs"
          test -f "$PACKAGE_DIR/dist/index.d.cts"
          node "$PACKAGE_DIR/dist/cli-entry.js" version --json
          node "$PACKAGE_DIR/dist/cli-entry.js" self-check --json
          node "$PACKAGE_DIR/dist/cli-entry.js" release-check --json
          node "$PACKAGE_DIR/dist/wizard-cli.js" help
          node -e "const m = require('@akaanakbaik/pterodactyl-gateway'); if (typeof m.createPtero !== 'function') process.exit(1); console.log('cjs ok', m.VERSION);"
          node --input-type=module -e "import { createPtero, VERSION } from '@akaanakbaik/pterodactyl-gateway'; if (typeof createPtero !== 'function') process.exit(1); console.log('esm ok', VERSION);"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-node-24
          path: akaanakbaik-pterodactyl-gateway-*.tgz
          if-no-files-found: error
          retention-days: 7

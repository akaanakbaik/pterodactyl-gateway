name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify
        run: npm run verify

      - name: Security audit
        run: npm audit --audit-level=high

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack package
        run: npm pack

      - name: Install packed package in temp project
        run: |
          set -euo pipefail
          PACKAGE_TGZ="$(ls akaanakbaik-pterodactyl-gateway-*.tgz | head -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          npm install --prefix "$SMOKE_DIR" "$PWD/$PACKAGE_TGZ" --force
          CLI="$SMOKE_DIR/node_modules/@akaanakbaik/pterodactyl-gateway/dist/cli-entry.js"
          WIZARD="$SMOKE_DIR/node_modules/@akaanakbaik/pterodactyl-gateway/dist/wizard-cli.js"
          test -f "$CLI"
          test -f "$WIZARD"
          node "$CLI" version
          node "$CLI" self-check
          node "$CLI" release-check
          node "$WIZARD" help
